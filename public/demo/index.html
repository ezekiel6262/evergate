<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Evergate demo</title>
  <meta name="description" content="Evergate on X Layer. Two minutes and thirty-seven seconds. The live app." />
  <style>
    :root {
      --lichen: #e6ebe1;
      --paper: #f7f9f4;
      --pine: #173d31;
      --ink: #10231d;
      --moss: #5d7c58;
      --marigold: #efa62b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--lichen);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }
    a { color: inherit; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(1100px, calc(100% - 40px));
      margin: 0 auto;
      padding: 22px 0 8px;
    }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--pine);
      font-size: 1.45rem;
    }
    .back {
      font-family: system-ui, sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      color: var(--pine);
      border: 1.5px solid var(--pine);
      border-radius: 999px;
      padding: 8px 16px;
    }
    main {
      width: min(1100px, calc(100% - 40px));
      margin: 0 auto;
      padding: 18px 0 64px;
    }
    h1 {
      font-weight: 400;
      font-size: clamp(2.2rem, 5vw, 3.6rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
      margin: 12px 0 10px;
    }
    p {
      font-family: system-ui, sans-serif;
      color: var(--moss);
      max-width: 38rem;
      line-height: 1.5;
      margin: 0 0 22px;
    }
    .frame {
      background: var(--pine);
      border-radius: 28px;
      padding: 12px;
    }
    video {
      width: 100%;
      height: auto;
      border-radius: 18px;
      background: #0d241d;
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="/" aria-label="Evergate home">
      <svg width="30" height="35" viewBox="0 0 32 37" fill="none" aria-hidden="true">
        <circle cx="16" cy="4.6" r="3.6" fill="#EFA62B" />
        <path d="M5.5 27.5V19.5a10.5 10.5 0 0 1 21 0v8z" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round" />
        <path d="M11 27.5v8M21 27.5v8" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" />
      </svg>
      Evergate
    </a>
    <a class="back" href="/">Open the app</a>
  </header>
  <main>
    <h1>The Evergate demo.</h1>
    <p>Two minutes and thirty-seven seconds. Recorded on the live app: the problem, the rule, who it is for, and TapeOut on X Layer.</p>
    <div class="frame">
      <video controls playsinline preload="metadata" src="/demo/evergate-demo.mp4">
        <a href="/demo/evergate-demo.mp4">Watch the Evergate demo</a>
      </video>
    </div>
  </main>
</body>
</html>
